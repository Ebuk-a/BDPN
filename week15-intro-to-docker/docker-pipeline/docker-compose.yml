version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: dataeng_postgres
    environment:
      POSTGRES_PASSWORD: mytestpassword
      POSTGRES_DB: dataeng_db
      POSTGRES_USER: postgres
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # ETL Pipeline
  etl:
    build: .
    container_name: dataeng_etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:mytestpassword@postgres:5432/dataeng_db
    volumes:
      - ./sample_data.csv:/data/sample_data.csv
    restart: on-failure
    networks:
      - 

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
